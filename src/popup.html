<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FB Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>FB Helper</h1>
        <span id="pageState">Album page required</span>
      </header>

      <nav class="mode-tabs" role="tablist" aria-label="Mode">
        <button id="modeDailyTab" class="mode-tab is-active" type="button" role="tab" data-mode="daily">Daily</button>
        <button id="modeSpecialTab" class="mode-tab" type="button" role="tab" data-mode="special">Special Sale</button>
        <button id="modeTabsTab" class="mode-tab" type="button" role="tab" data-mode="tabs">Open Tabs</button>
      </nav>

      <details>
        <summary>Furina settings</summary>
        <label for="furinaBaseUrl">Furina URL</label>
        <input id="furinaBaseUrl" type="url" placeholder="https://furina.example.com">
        <label for="furinaToken">Extension token</label>
        <input id="furinaToken" type="password" placeholder="Shared token from Furina .env">
      </details>

      <div id="uploadView">
      <label for="dataSource">Data source</label>
      <select id="dataSource">
        <option value="sheet">Sheet (helper tab)</option>
        <option value="metabase">Metabase (langsung dari DB)</option>
      </select>

      <div id="staffTabRow">
        <label for="staffTab">Staff tab</label>
        <select id="staffTab">
          <option value="">Set Furina settings, then choose helper</option>
        </select>
      </div>

      <label for="itemIds">Item IDs</label>
      <textarea id="itemIds" rows="8" placeholder="112549&#10;169575&#10;https://kyou.id/items/156998"></textarea>

      <div class="actions">
        <button id="previewButton" type="button">Preview</button>
        <button id="downloadButton" type="button" disabled>Download images</button>
        <button id="fillButton" type="button" disabled>Fill captions</button>
        <button id="refreshTabsButton" type="button">Refresh helpers</button>
        <button id="clearButton" type="button">Clear saved job</button>
      </div>
      </div>

      <div id="tabsView" hidden>
        <div class="field-head">
          <label id="tabsListLabel">kyou.id item tabs</label>
          <button id="scanTabsButton" type="button">Rescan</button>
        </div>
        <div id="tabsList" role="group" aria-labelledby="tabsListLabel"></div>
        <div class="actions">
          <button id="copyTabIdsButton" type="button" disabled>Copy IDs</button>
          <button id="toggleTabIdsButton" type="button" disabled>Unselect all</button>
          <button id="addToDailyButton" type="button" disabled>Add to Daily</button>
          <button id="addToSpecialButton" type="button" disabled>Add to Special Sale</button>
        </div>
      </div>

      <section id="status" aria-live="polite"></section>
      <section id="preview"></section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
